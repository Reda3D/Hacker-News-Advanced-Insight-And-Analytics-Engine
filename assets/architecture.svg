<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Architecture diagram: HN API → Client → Modules → Output">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F1A2E"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" fill="#0B1220" rx="10"/>

  <!-- Title -->
  <text x="450" y="32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="600" text-anchor="middle" fill="#F8FAFC">Engine Architecture</text>

  <!-- HN API -->
  <rect x="60" y="70" width="140" height="56" rx="8" fill="url(#box)" stroke="#FF6600" stroke-width="1.5"/>
  <text x="130" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" text-anchor="middle" fill="#FF6600">HN Firebase API v0</text>
  <text x="130" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" text-anchor="middle" fill="#64748B">hacker-news.firebaseio.com</text>

  <!-- Arrow to Client -->
  <line x1="200" y1="98" x2="256" y2="98" stroke="#64748B" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- HNClient -->
  <rect x="260" y="64" width="160" height="68" rx="8" fill="url(#box)" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="340" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" text-anchor="middle" fill="#38BDF8">HNClient</text>
  <text x="340" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" text-anchor="middle" fill="#94A3B8">Retries · Backoff · Timeout</text>
  <text x="340" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" text-anchor="middle" fill="#94A3B8">Validation · Error hierarchy</text>

  <!-- Arrow to Modules -->
  <line x1="420" y1="98" x2="476" y2="98" stroke="#64748B" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Modules -->
  <rect x="480" y="56" width="170" height="84" rx="8" fill="url(#box)" stroke="#10B981" stroke-width="1.5"/>
  <text x="565" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" text-anchor="middle" fill="#34D399">Modules</text>
  <text x="565" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" text-anchor="middle" fill="#94A3B8">items · users · lists</text>
  <text x="565" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" text-anchor="middle" fill="#94A3B8">sanitize · cache · errors</text>
  <text x="565" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" text-anchor="middle" fill="#94A3B8">Bounded traversal · TTL cache</text>

  <!-- Arrow to Output -->
  <line x1="650" y1="98" x2="706" y2="98" stroke="#64748B" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect x="710" y="64" width="140" height="68" rx="8" fill="url(#box)" stroke="#A855F7" stroke-width="1.5"/>
  <text x="780" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" text-anchor="middle" fill="#C084FC">Output</text>
  <text x="780" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" text-anchor="middle" fill="#94A3B8">Typed dicts · Safe HTML</text>
  <text x="780" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" text-anchor="middle" fill="#94A3B8">Structured errors · Reports</text>

  <!-- Bottom row: flow details -->
  <rect x="60" y="180" width="200" height="110" rx="8" fill="url(#box)" stroke="#1E293B" stroke-width="1"/>
  <text x="80" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" fill="#38BDF8">Input Validation</text>
  <text x="80" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• item_id: positive int</text>
  <text x="80" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• username: non-empty str</text>
  <text x="80" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• kind: enum StoryKind</text>
  <text x="80" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• bool explicitly rejected</text>
  <text x="80" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• URL-encoded usernames</text>

  <rect x="290" y="180" width="200" height="110" rx="8" fill="url(#box)" stroke="#1E293B" stroke-width="1"/>
  <text x="310" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" fill="#34D399">Resilience Layer</text>
  <text x="310" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• 4 retries + backoff</text>
  <text x="310" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• 10s timeout default</text>
  <text x="310" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• Retryable: 429/500/502/503/504</text>
  <text x="310" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• HNError with URL + status</text>
  <text x="310" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• Graceful null handling</text>

  <rect x="520" y="180" width="200" height="110" rx="8" fill="url(#box)" stroke="#1E293B" stroke-width="1"/>
  <text x="540" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" fill="#C084FC">Safety & Bounds</text>
  <text x="540" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• HTML allow-list sanitize</text>
  <text x="540" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• Bounded tree traversal</text>
  <text x="540" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• max_depth + max_nodes</text>
  <text x="540" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• TTL cache (optional)</text>
  <text x="540" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• Cache hit/miss stats</text>

  <rect x="750" y="180" width="110" height="110" rx="8" fill="url(#box)" stroke="#1E293B" stroke-width="1"/>
  <text x="770" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" fill="#FF6600">Consumers</text>
  <text x="770" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• AI Agents</text>
  <text x="770" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• Dashboards</text>
  <text x="770" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• Data pipelines</text>
  <text x="770" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• Researchers</text>
  <text x="770" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">• CI tools</text>
</svg>
