<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Bounded comment tree traversal diagram">
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F1A2E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" fill="#0B1220" rx="10"/>

  <text x="400" y="32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="600" text-anchor="middle" fill="#F8FAFC">Bounded Comment-Tree Traversal</text>

  <!-- Root story -->
  <rect x="320" y="56" width="160" height="44" rx="8" fill="url(#node)" stroke="#FF6600" stroke-width="1.5"/>
  <text x="400" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" text-anchor="middle" fill="#FF6600">Story #8863 (depth 0)</text>
  <text x="400" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" text-anchor="middle" fill="#64748B">Dropbox launch post</text>

  <!-- Arrows to depth 1 -->
  <line x1="360" y1="100" x2="200" y2="140" stroke="#64748B" stroke-width="1.2" marker-end="url(#ar2)"/>
  <line x1="400" y1="100" x2="400" y2="140" stroke="#64748B" stroke-width="1.2" marker-end="url(#ar2)"/>
  <line x1="440" y1="100" x2="600" y2="140" stroke="#64748B" stroke-width="1.2" marker-end="url(#ar2)"/>

  <!-- Depth 1 comments -->
  <rect x="120" y="148" width="160" height="40" rx="6" fill="url(#node)" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="200" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" text-anchor="middle" fill="#38BDF8">Comment #8952 (depth 1)</text>
  <text x="200" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="8" text-anchor="middle" fill="#64748B">by pg</text>

  <rect x="320" y="148" width="160" height="40" rx="6" fill="url(#node)" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="400" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" text-anchor="middle" fill="#38BDF8">Comment #9224 (depth 1)</text>
  <text x="400" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="8" text-anchor="middle" fill="#64748B">by tptacek</text>

  <rect x="520" y="148" width="160" height="40" rx="6" fill="url(#node)" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="600" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" text-anchor="middle" fill="#38BDF8">Comment #8917 (depth 1)</text>
  <text x="600" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="8" text-anchor="middle" fill="#64748B">by patio11</text>

  <!-- Arrows to depth 2 (only left branch shown) -->
  <line x1="160" y1="188" x2="100" y2="228" stroke="#64748B" stroke-width="1.2" marker-end="url(#ar2)"/>
  <line x1="200" y1="188" x2="200" y2="228" stroke="#64748B" stroke-width="1.2" marker-end="url(#ar2)"/>
  <line x1="240" y1="188" x2="300" y2="228" stroke="#64748B" stroke-width="1.2" marker-end="url(#ar2)"/>

  <!-- Depth 2 -->
  <rect x="40" y="236" width="120" height="36" rx="6" fill="url(#node)" stroke="#10B981" stroke-width="1.2"/>
  <text x="100" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" text-anchor="middle" fill="#34D399">Reply #1234 (depth 2)</text>
  <text x="100" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="8" text-anchor="middle" fill="#64748B">by dang</text>

  <rect x="160" y="236" width="120" height="36" rx="6" fill="url(#node)" stroke="#10B981" stroke-width="1.2"/>
  <text x="220" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" text-anchor="middle" fill="#34D399">Reply #1235 (depth 2)</text>

  <rect x="280" y="236" width="120" height="36" rx="6" fill="url(#node)" stroke="#10B981" stroke-width="1.2"/>
  <text x="340" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" text-anchor="middle" fill="#34D399">Reply #1236 (depth 2)</text>

  <!-- Truncation indicator for middle and right branches -->
  <text x="400" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" text-anchor="middle" fill="#475569">⋮</text>
  <text x="600" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" text-anchor="middle" fill="#475569">⋮</text>

  <!-- Bounds box -->
  <rect x="520" y="236" width="240" height="110" rx="8" fill="url(#node)" stroke="#1E293B" stroke-width="1"/>
  <text x="540" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" fill="#F8FAFC">Bounds enforced</text>
  <text x="540" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">max_depth = 2 → stop here</text>
  <text x="540" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">max_nodes = 50 → stop at limit</text>
  <text x="540" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">No runaway recursion</text>
  <text x="540" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10" fill="#94A3B8">Each node tagged with _depth</text>

  <!-- Legend -->
  <rect x="40" y="296" width="180" height="56" rx="6" fill="url(#node)" stroke="#1E293B" stroke-width="1"/>
  <text x="55" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#FF6600">■ Story</text>
  <text x="55" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#38BDF8">■ Depth 1</text>
  <text x="55" y="348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#34D399">■ Depth 2</text>
  <text x="120" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="9" fill="#64748B">→ kids[]</text>
</svg>
