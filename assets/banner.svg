<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Hacker News Advanced Insight And Analytics Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0F1A2E"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="url(#bg)" stroke="#1E293B" stroke-width="1"/>

  <!-- Logo circle with Y -->
  <circle cx="88" cy="120" r="36" fill="#0F1A2E" stroke="#FF6600" stroke-width="2.5"/>
  <text x="88" y="132" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="800" text-anchor="middle" fill="#FF6600">Y</text>

  <!-- Title -->
  <text x="150" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="32" font-weight="700" fill="#F8FAFC">Hacker News</text>
  <text x="150" y="142" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="500" fill="#F8FAFC">Advanced Insight And Analytics Engine</text>

  <!-- Tagline -->
  <text x="152" y="176" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15" fill="#94A3B8">Query, traverse, cache, and present HN data with validation, retries, and safe HTML.</text>

  <!-- Tech tags -->
  <text x="152" y="208" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="11.5" letter-spacing="1.3" fill="#64748B">PYTHON · FIREBASE API v0 · RETRIES · SANITIZATION · BOUNDED TRAVERSAL · MIT</text>

  <!-- Right panel: stats / features -->
  <rect x="820" y="52" width="318" height="156" rx="10" fill="#0F1A2E" stroke="#1E293B" stroke-width="1"/>

  <text x="844" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#FF6600">10</text>
  <text x="874" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#94A3B8">Endpoints covered</text>

  <text x="844" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#FF6600">4x</text>
  <text x="874" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#94A3B8">Retries + backoff</text>

  <text x="844" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#FF6600">&lt;200</text>
  <text x="890" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#94A3B8">Nodes bounded traversal</text>

  <text x="844" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#FF6600">0</text>
  <text x="862" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#94A3B8">Runtime deps (requests + bleach)</text>

  <text x="844" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#FF6600">v1.0.0</text>
  <text x="890" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" fill="#94A3B8">Stable release</text>
</svg>
