[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hn-advanced-insight-engine"
version = "1.0.0"
description = "Production-grade skill for querying, traversing, caching, and presenting Hacker News public data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Reda3D", email = "133293595+Reda3D@users.noreply.github.com" },
]
keywords = [
    "hacker-news",
    "hn",
    "api",
    "firebase",
    "data",
    "analytics",
    "skill",
    "agent",
    "llm",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28.0",
    "bleach>=6.0",
]

[project.optional-dependencies]
cache = ["cachetools>=5.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6.0",
    "mypy>=1.0",
    "responses>=0.23",
]

[project.urls]
Homepage = "https://github.com/Reda3D/Hacker-News-Advanced-Insight-And-Analytics-Engine"
Documentation = "https://github.com/Reda3D/Hacker-News-Advanced-Insight-And-Analytics-Engine#readme"
Repository = "https://github.com/Reda3D/Hacker-News-Advanced-Insight-And-Analytics-Engine"
Issues = "https://github.com/Reda3D/Hacker-News-Advanced-Insight-And-Analytics-Engine/issues"
Changelog = "https://github.com/Reda3D/Hacker-News-Advanced-Insight-And-Analytics-Engine/releases"

[tool.hatch.build.targets.wheel]
packages = ["hn_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: marks tests that hit the live HN API (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["hn_engine"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PL",  # Pylint
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
    "D203",   # 1 blank line required before class docstring
    "D213",   # Multi-line docstring summary should start at the second line
    "PLR0912",# Too many branches
    "PLR2004",# Magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D101", "D102", "D103", "SIM117"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = true
